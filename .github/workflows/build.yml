name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip vtspotify-project.zip -d extracted_app

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x extracted_app/gradlew || true

      - name: Build with Gradle
        working-directory: ./extracted_app
        run: |
          if [ -f "gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_app/app/build/outputs/apk/debug/app-debug.apk
